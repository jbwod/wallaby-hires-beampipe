name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: make install-dev
      - name: Check version metadata
        run: python scripts/version.py --check
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  package:
    name: Build and inspect distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build PEP 517 distributions
        run: python -m build
      - name: Check metadata and contents
        run: |
          python -m twine check dist/*
          python -m zipfile --list dist/*.whl
      - name: Test wheel in a clean environment
        run: |
          python -m venv /tmp/wallaby-wheel-test
          /tmp/wallaby-wheel-test/bin/pip install --no-deps dist/*.whl
          /tmp/wallaby-wheel-test/bin/wallaby_hires --version
          /tmp/wallaby-wheel-test/bin/python -c "import wallaby_hires, wallaby_hires.outputs"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
